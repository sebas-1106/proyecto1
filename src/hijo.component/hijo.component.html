<h3>Componente Hijo</h3>

<div class="cards">
  <div class="card" *ngFor="let personaje of listaPersonajes">
    <h4>{{ personaje.name }}</h4>
    <p>Casa: {{ personaje.house || 'Desconocida' }}</p>
    <p>Actor: {{ personaje.actor || 'N/A' }}</p>
    <img 
      *ngIf="personaje.image" 
      [src]="personaje.image" 
      alt="{{ personaje.name }}" 
      width="150">
  </div>
</div>
