<button (click)="contarElementos()">Contar</button>
<div [ngClass]="perfil(per)" *ngFor="let per of datos">
  <img
    [src]="per.image"
    [alt]="per.name"
    class="perfil__foto"
  />
  <span class="perfil__nombre">{{per.name}}</span>
  <span *ngIf="chico(per)" class="perfil__nombre">chico</span>
  <span *ngIf="chica(per)" class="perfil__nombre">chica</span>
</div>

<app-harryandhijos [datos]="datos"></app-harryandhijos>
